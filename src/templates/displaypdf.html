
<!DOCTYPE html>
<html>
<head>
    <title>Embedded PDF Viewer</title>
    <style>
        .pdf-viewer {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Viewing Document: {{ pdf_filename }}</h1>


    <iframe
        src="/displayPDF/{{ pdf_filename }}"
        class="pdf-viewer"
        title="Embedded PDF Document">


    </iframe>

    <p>You can also <a href="/displayPDF/{{ pdf_filename }}">download the PDF directly</a>.</p>

</body>
</html>
