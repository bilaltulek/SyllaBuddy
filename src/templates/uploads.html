<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Syllabus PDF</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .message { padding: 10px; margin-bottom: 20px; border: 1px solid transparent; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>Upload a Syllabus PDF</h1>

    <!-- Display messages from Flask (like success/error flashes) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- The crucial part: the form -->
    <form action="/uploadPdf" method="POST" enctype="multipart/form-data">
        <label for="fileInput">Choose PDF File:</label><br><br>
        <input type="file" id="fileInput" name="file" accept=".pdf" required>
        <br><br>
        <input type="submit" value="Upload PDF">
    </form>

    <hr>
    <a href="/syllabi">View All Syllabi (API link)</a>
</body>
</html>
