<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyllabusBuddy – History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='/assets/styles.css') }}" />
</head>

<body>

    <!-- ░░░ TOP NAV BAR ░░░ -->
    <nav class="navbar">
        <div class="logo">
            <img src="../static/assets/logo.svg" alt="logo" class="logo-icon">
            <span class="logo-text">SyllaBuddy</span>
        </div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Upload</a></li>
            <li><a class="active" href="#">History</a></li>
            <li><a href="#">Settings</a></li>
        </ul>

        <div class="profile">

            <span class="user-info">
                    {{ session.get('username') }}
            </span>
        </div>
    </nav>

    <!-- ░░░ PAGE TITLE ░░░ -->
    <section class="page-title">
        <h2>Syllabus Upload History</h2>
    </section>

    <!-- ░░░ HISTORY LIST ░░░ -->
    {% for syllabus in syllabi %}
        <a href="{{ url_for('displayAPDF', pdfName=syllabus.name) }}" class="card-link">
            <div class="card">



                <div class="meta">
                    <strong>{{ syllabus.name }}</strong><br>
                    ID: {{ syllabus.id }}
                </div>
                <a href="{{ url_for('parse_syllabus', pdfName=syllabus.name) }}" class="parse-button" download>
                        Parse & Download ICS
                    </a>
            </div>
        </a>
    {% endfor %}


    <script src="../static/assets/script.js"></script>
</body>
</html>
