<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyllabusBuddy – History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='/assets/styles.css') }}" />
</head>

<body>
<nav class="navbar">
    <div class="nav-left">
        <img src="logo.svg" alt="Logo" class="logo">
        <span class="brand">SyllaBuddy</span>
    </div>

    <ul class="nav-center">
        <a href="#"><img src="home.svg" class="icon"> Home</a>
        <a href="#"><img src="syllabi.svg" class="icon"> Syllabi</a>
        <a href="#"><img src="calendar.svg" class="icon"> Calendar</a>
        <a href="#"><img src="settings.svg" class="icon"> Settings</a>
    </ul>

    <div class="nav-right">
        <div class="profile-circle"></div>
        <div class="profile-info">
            <span class="profile-name">Jhon Doe</span>
            <span class="profile-email">JhonDoe123@gmail.com</span>
        </div>
    </div>
</nav>


    <!-- ░░░ PAGE TITLE ░░░ -->
    <section class="page-title">
        <h2>Syllabus Upload History</h2>
    </section>

    <!-- ░░░ HISTORY LIST ░░░ -->
    {% for syllabus in syllabi %}
        <a href="{{ url_for('displayAPDF', pdfName=syllabus.name) }}" class="card-link">
            <div class="card">



                <div class="meta">
                    <strong>{{ syllabus.name }}</strong><br>
                    ID: {{ syllabus.id }}
                </div>
            </div>
        </a>
    {% endfor %}


    <script src="../static/assets/script.js"></script>
</body>
</html>
