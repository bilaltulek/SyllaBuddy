<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyllabusBuddy – History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='/assets/styles.css') }}" />
</head>

<body>

   <!-- Navigation Bar -->
     <nav class="navbar">
        <div class="nav-left">
            <img src="../static/assets/logo.svg" alt="Logo" class="logo">
            <span class="brand">SyllaBuddy</span>
        </div>

        <ul class="nav-center">
            <a href="{{ url_for('dashboard') }}"><img src="../static/assets/home.svg" class="icon"> Home</a>
    <a href="{{ url_for('syllabi_page') }}"><img src="../static/assets/syllabi.svg" class="icon"> Syllabi</a>
    <a href="{{ url_for('calendar_page') }}"><img src="../static/assets/calendar.svg" class="icon"> Calendar</a>
    <a href="#"><img src="../static/assets/settings.svg" class="icon"> Settings</a>
        </ul>

        <div class="profile">
            <div class="pfp"></div>
            <span class="user-info">
                {{ session.get('username', 'Guest') }}
            </span>
        </div>
    </nav>

    <!-- ░░░ PAGE TITLE ░░░ -->
    <section class="page-title">
        <h2>Syllabus Upload History</h2>
    </section>

    <!-- ░░░ HISTORY LIST ░░░ -->
    {% for syllabus in syllabi %}
<div class="card">

    <a href="{{ url_for('displayAPDF', pdfName=syllabus.name) }}" class="card-link">
        <div class="meta">
            <strong>{{ syllabus.name }}</strong><br>
            ID: {{ syllabus.id }}
        </div>
    </a>

    <!-- DOWNLOAD BUTTON (CORRECTED) -->
    <a
        href="{{ url_for('parse_syllabus', pdfName=syllabus.name) }}"
        class="download-btn"
        download
    >
        <img src="../static/assets/arrow.png" alt="Download">
    </a>

</div>
{% endfor %}




    <script src="../static/assets/script.js"></script>
</body>
</html>
